name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the package supports and the newest the maintainers run: a Node 22-only
        # difference (node --test reading a directory as one file) once passed here and failed there.
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
        # Full history: brief-five and target put Rig 4's code back from its commit with `git archive`
        # as their controls. A shallow clone has no such commit, so the control cannot run.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The harness tests drive a real headless Chrome. ubuntu-latest ships
      # google-chrome; the per-platform finder in harness/ locates it.
      - run: google-chrome --version
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: npx biome ci .
      - run: npm test

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Personal-data guard: proves it can fail, then scans the tree. Allow list: .personal-data-allow
      - run: tools/check-no-personal-data --self-test && tools/check-no-personal-data
